services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: paperbeginner-api
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - JWT_SECRET=${JWT_SECRET:-paperbeginner-demo-secret-change-me}
      - DATABASE_URL=sqlite:////app/data/paperbeginner.db
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - api_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: deployments/docker/frontend.Dockerfile
    container_name: paperbeginner-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  api_data:
