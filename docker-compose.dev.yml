version: '3.8'

# Development overrides
services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: .
      dockerfile: deployments/docker/backend.dev.Dockerfile
    volumes:
      - ./backend:/app
    environment:
      - APP_ENV=development
      - GIN_MODE=debug

  worker:
    build:
      context: .
      dockerfile: deployments/docker/backend.dev.Dockerfile
    command: ["go", "run", "./cmd/worker"]
    volumes:
      - ./backend:/app
    environment:
      - APP_ENV=development

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployments/docker/frontend.dev.Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development

