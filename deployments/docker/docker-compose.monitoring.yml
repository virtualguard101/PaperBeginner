version: '3.8'

# Optional monitoring stack - use with:
# docker compose -f docker-compose.yml -f deployments/docker/docker-compose.monitoring.yml up

services:
  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: paperbeginer-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - paperbeginer-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.3.1
    container_name: paperbeginer-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - paperbeginer-network

  # Loki for log aggregation
  loki:
    image: grafana/loki:2.9.4
    container_name: paperbeginer-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - paperbeginer-network

  # Promtail for log collection
  promtail:
    image: grafana/promtail:2.9.4
    container_name: paperbeginer-promtail
    volumes:
      - /var/log:/var/log:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - paperbeginer-network

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

