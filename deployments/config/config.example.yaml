# PaperBeginer Configuration Example
# Copy this file to config.yaml and update values

app:
  env: development  # development, production
  port: 8080
  secret: change-this-to-a-secure-secret
  rate_limit_rps: 10
  rate_limit_burst: 20

database:
  url: postgres://paperbeginer:paperbeginer_secret@localhost:5432/paperbeginer?sslmode=disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

redis:
  url: redis://localhost:6379
  password: ""
  db: 0

minio:
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  use_ssl: false
  bucket: paperbeginer

jwt:
  secret: your-jwt-secret-change-in-production
  expiry: 24h

llm:
  default: openai
  openai:
    api_key: ""  # Your OpenAI API key
    model: gpt-4o
    base_url: ""  # Leave empty for default
  anthropic:
    api_key: ""  # Your Anthropic API key
    model: claude-3-5-sonnet-20241022
  deepseek:
    api_key: ""  # Your DeepSeek API key
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
  ollama:
    host: http://localhost:11434
    model: llama3.1

github:
  token: ""  # Optional: GitHub personal access token for higher rate limits

